##############################################################################
# Lombard TTS inference: closed-loop machine speech chain in static babble noise
# (data/{dataset}/data/lombard/noise/babble.wav generated by lombard_synth.py).
#
# Usage: bash run.sh --train false --exp_cfg {your-exp_cfg} --infer_cfg config/infer/lombard_tts/speech_chain_babble.yaml
# Note: `--infer_cfg <path>` loads this file as a single flat infer_conf (runner.py only expands
# 'shared_args'/'exclu_args' for a Dict embedded directly in exp_cfg's own 'infer_cfg:' block, as
# this exp_cfg does for its full 5-condition test sweep) -- so this file covers ONE noise level;
# copy it and change `snr` (e.g. to -10) to test the other one.
# ############################################################################
vocoder: hifigan
max_loops: 4
loss_tol: 0.01
select_best: true
noise_type: babble
snr: 0
